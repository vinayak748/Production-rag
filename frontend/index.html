<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Production RAG</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 720px;
    margin: 40px auto;
    padding: 0 20px;
    background: #0f1115;
    color: #e6e6e6;
  }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  p.sub { color: #9aa0a6; margin-top: 0; }
  #q {
    width: 100%;
    padding: 12px 14px;
    font-size: 1rem;
    border-radius: 8px;
    border: 1px solid #333;
    background: #1a1d24;
    color: #e6e6e6;
    box-sizing: border-box;
  }
  button {
    margin-top: 10px;
    padding: 10px 18px;
    font-size: 0.95rem;
    border-radius: 8px;
    border: none;
    background: #4f7cff;
    color: white;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  #result { margin-top: 24px; white-space: pre-wrap; line-height: 1.5; }
  .sources { margin-top: 14px; font-size: 0.85rem; color: #9aa0a6; }
  .error { color: #ff6b6b; }
  .upload-box {
    margin-top: 20px;
    padding: 14px;
    border: 1px dashed #333;
    border-radius: 8px;
    background: #1a1d24;
  }
  .upload-box input[type="file"] { color: #e6e6e6; }
  .upload-box button {
    margin-top: 8px;
    margin-left: 0;
    background: #2fb872;
  }
</style>
</head>
<body>
  <h1>Production RAG</h1>
  <p class="sub">Hybrid retrieval (BM25 + dense + reranking) over your documents.</p>

  <!-- Empty = same origin (the backend serves this page). Set a full URL only if hosting the frontend elsewhere. -->
  <script>const API_BASE = "";  // same origin: backend serves this page</script>

  <div class="upload-box">
    <input id="file" type="file" accept=".txt,.md,.pdf" />
    <button id="upload">Add document</button>
    <div id="uploadStatus" class="sources"></div>
  </div>

  <input id="q" type="text" placeholder="Ask a question about your documents…" />
  <button id="ask">Ask</button>

  <div id="result"></div>

<script>
const qInput = document.getElementById("q");
const btn = document.getElementById("ask");
const resultDiv = document.getElementById("result");

async function ask() {
  const question = qInput.value.trim();
  if (!question) return;

  btn.disabled = true;
  resultDiv.innerHTML = "Thinking…";

  try {
    const res = await fetch(`${API_BASE}/query`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || `Request failed (${res.status})`);
    }
    const data = await res.json();
    resultDiv.innerHTML =
      `<div>${data.answer}</div>` +
      `<div class="sources">Sources: ${data.source_chunk_ids.join(", ")}</div>`;
  } catch (e) {
    resultDiv.innerHTML = `<div class="error">${e.message}</div>`;
  } finally {
    btn.disabled = false;
  }
}

btn.addEventListener("click", ask);
qInput.addEventListener("keydown", (e) => { if (e.key === "Enter") ask(); });

const fileInput = document.getElementById("file");
const uploadBtn = document.getElementById("upload");
const uploadStatus = document.getElementById("uploadStatus");

async function uploadDoc() {
  const file = fileInput.files[0];
  if (!file) {
    uploadStatus.innerHTML = '<span class="error">Choose a .txt, .md, or .pdf file first.</span>';
    return;
  }
  uploadBtn.disabled = true;
  uploadStatus.textContent = "Uploading and indexing…";

  const formData = new FormData();
  formData.append("file", file);

  try {
    const res = await fetch(`${API_BASE}/upload`, { method: "POST", body: formData });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || `Upload failed (${res.status})`);
    }
    const data = await res.json();
    uploadStatus.textContent =
      `Indexed "${data.doc_id}" (${data.chars_extracted} chars). Total documents: ${data.total_documents}.`;
  } catch (e) {
    uploadStatus.innerHTML = `<span class="error">${e.message}</span>`;
  } finally {
    uploadBtn.disabled = false;
  }
}

uploadBtn.addEventListener("click", uploadDoc);
</script>
</body>
</html>
